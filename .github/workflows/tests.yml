name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run test suite
        run: npm test

      - name: Check README badge counts
        run: npm run check:badges

      - name: Report .opencode/.windsurf parity
        # Informational only: does not fail the build. Known orphans
        # (bullmq/prisma/typeorm skills) are tracked deliberately rather
        # than blocking CI — see scripts/check-platform-parity.mjs.
        run: npm run check:parity
